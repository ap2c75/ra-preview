name = "somun-chatbot-api"
main = "src/worker.mjs"
compatibility_date = "2026-09-01"

[vars]
OPERATIONS_ENABLED = "false"
ALLOWED_ORIGINS = "https://ap2c75.github.io,http://127.0.0.1:8787,http://localhost:8787,http://127.0.0.1:8792"
POLICY_VERSION = "somun-consultation-third-party-20260910"
PRIVACY_CONTACT = ""
RETENTION_DAYS = "90"

[[d1_databases]]
binding = "DB"
database_name = "somun-chatbot"
database_id = "REPLACE_AFTER_D1_CREATE"
migrations_dir = "migrations"

[triggers]
crons = ["17 18 * * *"]
